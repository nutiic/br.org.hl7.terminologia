services:
  fhir-ig-publisher:
    build: .
    volumes:
      - .:/app
      - ../packages:/root/.fhir/packages
    command: >
        bash -c "
                 rm -rf temp;
                 mkdir temp;                 
                 rm -rf web-root/ig-build-zips;     
                 rm -rf web-root/fhir;            
                 java -Xms8g -Xm16g -Dfile.encoding=UTF-8 -jar /app/input-cache/publisher.jar -generate-package-registry /app/web-root;
                 java -Xms8g -Xmx16g -Dfile.encoding=UTF-8 -jar /app/input-cache/publisher.jar -go-publish -source /app -web /app/web-root -temp /app/temp -registry /app/ig-registry/fhir-ig-list.json -history /app/ig-history -templates /app/web-root/templates" 